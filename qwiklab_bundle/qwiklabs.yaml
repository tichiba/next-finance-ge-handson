schema_version: 2
entity_type: Lab
default_locale: ja
title: "ネクストファイナンス：Gemini Enterprise ハンズオン（情報収集・社内調査・データ分析）"
description: "Gemini Notebook、Gemini Enterprise（GWS・社内文書横断検索）、およびBigQueryデータ分析エージェント（gemini-3.8-flash / カスタムA2A連携）を一気通貫で体験する経営幹部向けハンズオンラボ（11ユーザーアカウント払出対応：user00[管理者用1]＋user01〜user10[受講者9名＋予備1名]）。"
instruction:
  type: md
  uri: instructions/ja.md
duration: 180
max_duration: 240
credits: 5
level: intermediate
tags:
  - gemini-enterprise
  - agentspace
  - bigquery
  - conversational-analytics
  - a2a
  - notebooklm
product_tags:
  - vertex ai
  - bigquery
  - cloud storage
role_tags:
  - business-analyst
  - data-analyst
  - executive
domain_tags:
  - portfolio_ai
  - portfolio_data_analytics

resources:
  - type: file
    id: ir-next-group-pdf
    title: "①【シナリオ1用】ネクストグループ統合報告書2026（主要抜粋版PDF）"
    description: "Gemini Notebookにアップロードしてポッドキャスト生成・横断QAに使用する資料①"
    uri: resources/next_group_integrated_report_2026.pdf
  - type: file
    id: ir-next-finance-pdf
    title: "②【シナリオ1用】ネクストファイナンス IR決算および事業財務ハイライト資料（PDF）"
    description: "Gemini Notebookにアップロードしてポッドキャスト生成・横断QAに使用する資料②"
    uri: resources/next_finance_ir_highlights_2026.pdf
  - type: file
    id: credit-policy-pdf
    title: "③【シナリオ2用】ネクストファイナンス 通信料金等債権管理および与信運用規程（PDF）"
    description: "社内規程（第11条・第14条・第18条）の原文PDF（GCS自動投入済／Drive手動配置用）"
    uri: resources/next_finance_credit_policy.pdf
  - type: file
    id: gws-backup-pdf
    title: "④【シナリオ2用】営業部メール・審査部Chat議論履歴アーカイブ（PDF）"
    description: "東都ロジスティクス支払期日延長相談メールおよび審査部Chatログ（GCS自動投入済／Drive手動配置用）"
    uri: resources/next_finance_email_chat_archive.pdf

environment:
  resources:
    - type: gcp_project
      id: project_0
      variant: gcpd
      default_region: us-central1
      default_zone: us-central1-a
      allowed_locations:
        - us-central1
        - us-east1
        - us-west1
      startup_script:
        type: qwiklabs
        path: tf
        custom_properties:
          - key: primary_user_email
            reference: user_1.username
    - type: gcp_user
      id: user_1
      variant: default
      permissions:
        - project: project_0
          roles:
            - roles/owner
            - roles/bigquery.admin
            - roles/discoveryengine.admin
            - roles/geminidataanalytics.dataAgentOwner
            - roles/geminidataanalytics.dataAgentUser
            - roles/storage.admin
